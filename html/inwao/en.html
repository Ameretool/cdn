<!DOCTYPE html>
<html lang='en'>
<head>
    <meta http-equiv='Content-Type' content='text/html; charset=UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, shrink-to-fit=no'>
    <title>Website Under Construction</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Montserrat);
        @import url(https://fonts.googleapis.com/css?family=Open+Sans:400,700);

        body {
            overflow: hidden;
        }

        h1 {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 4em;
            color: #333;
            -webkit-text-shadow: 0 2px 1px rgba(0, 0, 0, 0.6), 0 0 2px rgba(0, 0, 0, 0.7);
            -moz-text-shadow: 0 2px 1px rgba(0, 0, 0, 0.6), 0 0 2px rgba(0, 0, 0, 0.7);
            text-shadow: 0 2px 1px rgba(0, 0, 0, 0.6), 0 0 2px rgba(0, 0, 0, 0.7);
            word-spacing: 16px;
        }

        p {
            font-family: 'Open Sans', sans-serif;
            font-size: 1.4em;
            font-weight: bold;
            color: #222;
            text-shadow: 0 0 40px #FFFFFF, 0 0 30px #FFFFFF, 0 0 20px #FFFFFF;
        }

        .container {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            background: url('');
            background-size: cover;
        }

        .wrapper {
            width: 100%;
            min-height: 100%;
            height: auto;
            display: table;
        }

        .content {
            display: table-cell;
            vertical-align: middle;
        }

        .item {
            width: auto;
            height: auto;
            margin: 0 auto;
            text-align: center;
            padding: 8px;
        }

        canvas {
            position: absolute;
            z-index: 0;
            left: 0px;
            top: 0px;
            width: 100%;
        }

        .background {
            display: flex;
            z-index: 3;
            height: 100vh;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            font-family: 'Text Me One', sans-serif;
        }

        /* Gradient flowing animation */
        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Copyright line at the bottom */
        .copyright {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 14px;
            z-index: 5;
            text-align: center;
            font-family: 'Open Sans', sans-serif;
            font-size: 0.85em;
            color: #555;
            letter-spacing: 1px;
            opacity: 0.75;
            pointer-events: none;
        }

        @media only screen and (min-width: 800px) {
            h1 {
                font-size: 6em;
            }

            p {
                font-size: 1.6em;
            }
        }

        @media only screen and (max-width: 320px) {
            h1 {
                font-size: 2em;
            }

            p {
                font-size: 1.2em;
            }
        }
    </style>
</head>

<body><canvas id='background' width='1280' height='642'></canvas>
    <div class='container'>
        <div class='wrapper'>
            <div class='content'>
                <div class='item'>
                    <!-- Place your content here to have it be centered vertically and horizontally  -->
                    <h1>Coming Soon</h1>
                    <p>Website Under Construction...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Copyright -->
    <div class='copyright'>&copy; 2026 Your Company. All rights reserved.</div>

    <script>
        /* =========================================================
         *  CONFIG — All editable options are collected here.
         *  In most cases you only need to change this section.
         * ========================================================= */
        const CONFIG = {
            // Number of particles
            particleCount: 100,

            // Trail length (number of history points; larger = longer tail)
            trailLength: 45,

            // Base particle size range
            sizeMin: 4,
            sizeMax: 10,

            // Mouse influence factor (larger = particles near the cursor grow more)
            mouseInfluence: 10,

            /* -------- Particle color scheme --------
             * Available values:
             *   'original'  — original random gray/blue colors
             *   'rainbow'   — each particle gets a random rainbow color
             *   'gradient'  — particles spread evenly across the hue wheel (recommended)
             *   'breathing' — colors flow over time (breathing rainbow)
             */
            colorMode: 'gradient',

            // Saturation and lightness for gradient / breathing modes
            saturation: 100,   // 0-100
            lightness: 60,     // 0-100

            // Color change speed for breathing mode (smaller = faster)
            breathingSpeed: 20,
            // Hue gap between particles in breathing mode
            breathingSpread: 3,

            // Colors used in original mode
            originalColors: ['#ccc', '#00174a', '#3c8dbc'],

            /* -------- Background and text --------
             * To enable the colorful gradient background,
             * simply turn the option below on.
             * You can also edit the .container background in CSS directly.
             */
            enableGradientBackground: false,
            backgroundGradient: 'linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d)',

            /* -------- Gradient text --------
             * The title and subtitle each use their own independent
             * random gradient, and the gradient flows continuously.
             */
            enableGradientText: true,

            // Gradient for the title "Coming Soon" (independent random)
            titleGradient: (function () {
                const h1 = Math.floor(Math.random() * 360);
                const h2 = (h1 + 60 + Math.floor(Math.random() * 120)) % 360;
                const h3 = (h2 + 60 + Math.floor(Math.random() * 120)) % 360;
                const h4 = (h3 + 60 + Math.floor(Math.random() * 120)) % 360;
                return 'linear-gradient(90deg, hsl(' + h1 + ',100%,65%), hsl(' + h2 + ',100%,65%), hsl(' + h3 + ',100%,65%), hsl(' + h4 + ',100%,65%))';
            })(),

            // Gradient for the subtitle "Website Under Construction..." (independent random)
            subtitleGradient: (function () {
                const h1 = Math.floor(Math.random() * 360);
                const h2 = (h1 + 60 + Math.floor(Math.random() * 120)) % 360;
                const h3 = (h2 + 60 + Math.floor(Math.random() * 120)) % 360;
                const h4 = (h3 + 60 + Math.floor(Math.random() * 120)) % 360;
                return 'linear-gradient(90deg, hsl(' + h1 + ',100%,65%), hsl(' + h2 + ',100%,65%), hsl(' + h3 + ',100%,65%), hsl(' + h4 + ',100%,65%))';
            })(),
        };
        /* ===================== CONFIG END ===================== */


        // ---------- Apply gradient background (optional) ----------
        if (CONFIG.enableGradientBackground) {
            document.querySelector('.container').style.background = CONFIG.backgroundGradient;
        }

        // ---------- Apply gradient text (optional, with flowing animation) ----------
        if (CONFIG.enableGradientText) {
            const h1El = document.querySelector('h1');
            const pEl = document.querySelector('p');

            // Title: uses titleGradient
            h1El.style.background = CONFIG.titleGradient;
            h1El.style.backgroundSize = '200% 200%';
            h1El.style.webkitBackgroundClip = 'text';
            h1El.style.backgroundClip = 'text';
            h1El.style.color = 'transparent';
            h1El.style.textShadow = 'none';
            h1El.style.animation = 'gradientMove 4s linear infinite';

            // Subtitle: uses subtitleGradient
            pEl.style.background = CONFIG.subtitleGradient;
            pEl.style.backgroundSize = '200% 200%';
            pEl.style.webkitBackgroundClip = 'text';
            pEl.style.backgroundClip = 'text';
            pEl.style.color = 'transparent';
            pEl.style.textShadow = 'none';
            pEl.style.animation = 'gradientMove 4s linear infinite';
        }

        // ---------- Color picker function ----------
        function getParticleColor(index, total) {
            switch (CONFIG.colorMode) {
                case 'original':
                    return CONFIG.originalColors[Math.floor(Math.random() * CONFIG.originalColors.length)];

                case 'rainbow':
                    return 'hsl(' + Math.floor(Math.random() * 360) + ', ' +
                        CONFIG.saturation + '%, ' + CONFIG.lightness + '%)';

                case 'gradient':
                    return 'hsl(' + (index / total * 360) + ', ' +
                        CONFIG.saturation + '%, ' + CONFIG.lightness + '%)';

                case 'breathing':
                    // Initial hue; it changes over time during the animation
                    return 'hsl(' + (index * CONFIG.breathingSpread % 360) + ', ' +
                        CONFIG.saturation + '%, ' + CONFIG.lightness + '%)';

                default:
                    return '#ccc';
            }
        }

        // ---------- Initialize particles ----------
        const particles = [];
        for (let i = 0; i < CONFIG.particleCount; i++) {
            particles.push({
                x: Math.random() > 0.5 ? 0 : window.innerWidth,
                y: window.innerHeight / 2,
                vx: Math.random() * 2 - 1,
                vy: Math.random() * 2 - 1,
                history: [],
                size: CONFIG.sizeMin + Math.random() * (CONFIG.sizeMax - CONFIG.sizeMin),
                color: getParticleColor(i, CONFIG.particleCount)
            });
        }

        const mouse = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2
        };
        const canvas = document.getElementById('background');
        if (canvas && canvas.getContext) {
            var context = canvas.getContext('2d');
            Initialize();
        }

        function Initialize() {
            canvas.addEventListener('mousemove', MouseMove, false);
            window.addEventListener('resize', ResizeCanvas, false);
            TimeUpdate();
            context.beginPath();
            ResizeCanvas();
        }

        function TimeUpdate(e) {
            context.clearRect(0, 0, window.innerWidth, window.innerHeight);

            for (let i = 0; i < particles.length; i++) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;

                if (particles[i].x > window.innerWidth) {
                    particles[i].vx = -1 - Math.random();
                } else if (particles[i].x < 0) {
                    particles[i].vx = 1 + Math.random();
                } else {
                    particles[i].vx *= 1 + Math.random() * 0.005;
                }

                if (particles[i].y > window.innerHeight) {
                    particles[i].vy = -1 - Math.random();
                } else if (particles[i].y < 0) {
                    particles[i].vy = 1 + Math.random();
                } else {
                    particles[i].vy *= 1 + Math.random() * 0.005;
                }

                // Actual color of the current particle (breathing mode changes over time)
                let particleColor = particles[i].color;
                if (CONFIG.colorMode === 'breathing') {
                    const hue = (Date.now() / CONFIG.breathingSpeed + i * CONFIG.breathingSpread) % 360;
                    particleColor = 'hsl(' + hue + ', ' + CONFIG.saturation + '%, ' + CONFIG.lightness + '%)';
                }

                // Draw the trail
                context.strokeStyle = particleColor;
                context.beginPath();
                for (var j = 0; j < particles[i].history.length; j++) {
                    context.lineTo(particles[i].history[j].x, particles[i].history[j].y);
                }
                context.stroke();

                // Record the trail
                particles[i].history.push({
                    x: particles[i].x,
                    y: particles[i].y
                });
                if (particles[i].history.length > CONFIG.trailLength) {
                    particles[i].history.shift();
                }

                // Trail drifts toward the mouse
                for (var j = 0; j < particles[i].history.length; j++) {
                    particles[i].history[j].x += 0.01 * (mouse.x - particles[i].history[j].x) / (CONFIG.trailLength / j);
                    particles[i].history[j].y += 0.01 * (mouse.y - particles[i].history[j].y) / (CONFIG.trailLength / j);
                }

                // Mouse distance affects dot size
                let distanceFactor = DistanceBetween(mouse, particles[i]);
                distanceFactor = Math.pow(Math.max(Math.min(CONFIG.mouseInfluence - distanceFactor / 10, CONFIG.mouseInfluence), 2), 0.5);

                context.fillStyle = particleColor;
                context.beginPath();
                context.arc(particles[i].x, particles[i].y, particles[i].size * distanceFactor, 0, Math.PI * 2, true);
                context.closePath();
                context.fill();
            }

            requestAnimationFrame(TimeUpdate);
        }

        function MouseMove(e) {
            mouse.x = e.layerX;
            mouse.y = e.layerY;
        }

        function Draw(x, y) {
            context.strokeStyle = '#ff0000';
            context.lineWidth = 4;
            context.lineTo(x, y);
            context.stroke();
        }

        function ResizeCanvas(e) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function DistanceBetween(p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            return Math.sqrt(dx * dx + dy * dy);
        }
    </script>

</body>
</html>
