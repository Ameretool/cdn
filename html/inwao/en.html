<!DOCTYPE html>
<html lang='en'>
<head>
    <meta http-equiv='Content-Type' content='text/html; charset=UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, shrink-to-fit=no'>
    <title>Website Under Construction</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Montserrat);
        @import url(https://fonts.googleapis.com/css?family=Open+Sans:400,700);

        body {
            overflow: hidden;
        }

        h1 {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 4em;
            color: #333;
            -webkit-text-shadow: 0 2px 1px rgba(0, 0, 0, 0.6), 0 0 2px rgba(0, 0, 0, 0.7);
            -moz-text-shadow: 0 2px 1px rgba(0, 0, 0, 0.6), 0 0 2px rgba(0, 0, 0, 0.7);
            text-shadow: 0 2px 1px rgba(0, 0, 0, 0.6), 0 0 2px rgba(0, 0, 0, 0.7);
            word-spacing: 16px;
        }

        p {
            font-family: 'Open Sans', sans-serif;
            font-size: 1.4em;
            font-weight: bold;
            color: #222;
            text-shadow: 0 0 40px #FFFFFF, 0 0 30px #FFFFFF, 0 0 20px #FFFFFF;
        }

        .container {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            /* ===== 可修改：页面背景（原为空 url） =====
               留空则透明，露出 canvas 粒子背景。
               想用纯色渐变可改成：
               background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            */
            background: url('');
            background-size: cover;
        }

        .wrapper {
            width: 100%;
            min-height: 100%;
            height: auto;
            display: table;
        }

        .content {
            display: table-cell;
            vertical-align: middle;
        }

        .item {
            width: auto;
            height: auto;
            margin: 0 auto;
            text-align: center;
            padding: 8px;
        }

        canvas {
            position: absolute;
            z-index: 0;
            left: 0px;
            top: 0px;
            width: 100%;
            touch-action: none;   /* 移动端：阻止触摸时页面滚动/缩放 */
        }

        .background {
            display: flex;
            z-index: 3;
            height: 100vh;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            font-family: 'Text Me One', sans-serif;
        }

        @media only screen and (min-width: 800px) {
            h1 {
                font-size: 6em;
            }

            p {
                font-size: 1.6em;
            }
        }

        @media only screen and (max-width: 320px) {
            h1 {
                font-size: 2em;
            }

            p {
                font-size: 1.2em;
            }
        }
    </style>
</head>

<body><canvas id='background' width='1280' height='642'></canvas>
    <div class='container'>
        <div class='wrapper'>
            <div class='content'>
                <div class='item'>
                    <!-- Place your content here to have it be centered vertically and horizontally  -->
                    <h1 id="title">Coming Soon</h1>
                    <p id="subtitle">Website Under Construction...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
         *  CONFIG —— 所有可修改项集中在这里，后期只改这一段即可
         * ========================================================= */
        const CONFIG = {
            // 粒子数量（会自动根据移动端降级，见下方 isTouch）
            particleCount: 100,

            // 拖尾长度（历史轨迹点数，越大尾巴越长）
            trailLength: 45,

            // 粒子基础大小范围
            sizeMin: 4,
            sizeMax: 10,

            // 鼠标/手指影响范围系数（越大，指针附近粒子放大越明显）
            mouseInfluence: 10,

            /* -------- 粒子颜色方案 --------
             * 可选值：
             *   'original'  —— 原版灰蓝随机色
             *   'rainbow'   —— 每个粒子随机彩虹色
             *   'gradient'  —— 100 个粒子沿色相均匀分布（推荐，协调不杂乱）
             *   'breathing' —— 颜色随时间流动（会呼吸的彩色）
             */
            colorMode: 'gradient',

            // gradient / breathing 模式下的饱和度与亮度
            saturation: 100,   // 0-100
            lightness: 60,     // 0-100

            // breathing 模式的变色速度（越小变色越快）
            breathingSpeed: 20,
            // breathing 模式下每个粒子之间的色相间隔
            breathingSpread: 3,

            // original 模式下使用的颜色列表
            originalColors: ['#ccc', '#00174a', '#3c8dbc'],

            /* =========================================================
             *  文字颜色 —— 标题和副标题各用一种颜色
             * ========================================================= */

            // 标题「Coming Soon」的颜色
            // 可以是纯色：'#e74c3c'
            // 也可以是渐变：'linear-gradient(90deg, #ff6b6b, #feca57)'
            titleColor: '#e74c3c',

            // 副标题「Website Under Construction...」的颜色
            subtitleColor: '#2980b9',

            // 是否给标题/副标题启用渐变文字
            // 如果 titleColor / subtitleColor 写的是渐变，这里必须为 true
            enableGradientText: false,

            /* -------- 背景渐变（可选） -------- */
            enableGradientBackground: false,
            backgroundGradient: 'linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d)',
        };
        /* ===================== CONFIG 结束 ===================== */


        // ---------- 背景渐变（可选） ----------
        if (CONFIG.enableGradientBackground) {
            document.querySelector('.container').style.background = CONFIG.backgroundGradient;
        }

        // ---------- 文字颜色应用 ----------
        const titleEl = document.getElementById('title');
        const subtitleEl = document.getElementById('subtitle');

        function applyTextColor(el, value) {
            if (CONFIG.enableGradientText && value.indexOf('gradient') !== -1) {
                el.style.background = value;
                el.style.webkitBackgroundClip = 'text';
                el.style.backgroundClip = 'text';
                el.style.color = 'transparent';
                el.style.textShadow = 'none';
            } else {
                el.style.color = value;
            }
        }
        applyTextColor(titleEl, CONFIG.titleColor);
        applyTextColor(subtitleEl, CONFIG.subtitleColor);


        // ---------- 取色函数 ----------
        function getParticleColor(index, total) {
            switch (CONFIG.colorMode) {
                case 'original':
                    return CONFIG.originalColors[Math.floor(Math.random() * CONFIG.originalColors.length)];

                case 'rainbow':
                    return 'hsl(' + Math.floor(Math.random() * 360) + ', ' +
                        CONFIG.saturation + '%, ' + CONFIG.lightness + '%)';

                case 'gradient':
                    return 'hsl(' + (index / total * 360) + ', ' +
                        CONFIG.saturation + '%, ' + CONFIG.lightness + '%)';

                case 'breathing':
                    return 'hsl(' + (index * CONFIG.breathingSpread % 360) + ', ' +
                        CONFIG.saturation + '%, ' + CONFIG.lightness + '%)';

                default:
                    return '#ccc';
            }
        }

        // ---------- 移动端自动降级 ----------
        const isTouch = window.matchMedia('(pointer: coarse)').matches
            || window.innerWidth < 768;

        const particleCount = isTouch ? Math.round(CONFIG.particleCount * 0.4) : CONFIG.particleCount;
        const trailLength = isTouch ? Math.round(CONFIG.trailLength * 0.45) : CONFIG.trailLength;

        // ---------- 初始化粒子 ----------
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() > 0.5 ? 0 : window.innerWidth,
                y: window.innerHeight / 2,
                vx: Math.random() * 2 - 1,
                vy: Math.random() * 2 - 1,
                history: [],
                size: CONFIG.sizeMin + Math.random() * (CONFIG.sizeMax - CONFIG.sizeMin),
                color: getParticleColor(i, particleCount)
            });
        }

        const mouse = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2
        };
        const canvas = document.getElementById('background');
        if (canvas && canvas.getContext) {
            var context = canvas.getContext('2d');
            Initialize();
        }

        function Initialize() {
            canvas.addEventListener('mousemove', MouseMove, false);
            // 移动端触摸支持
            canvas.addEventListener('touchstart', TouchMove, { passive: false });
            canvas.addEventListener('touchmove', TouchMove, { passive: false });
            window.addEventListener('resize', ResizeCanvas, false);
            TimeUpdate();
            context.beginPath();
            ResizeCanvas();
        }

        function TimeUpdate(e) {
            context.clearRect(0, 0, window.innerWidth, window.innerHeight);

            for (let i = 0; i < particles.length; i++) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;

                if (particles[i].x > window.innerWidth) {
                    particles[i].vx = -1 - Math.random();
                } else if (particles[i].x < 0) {
                    particles[i].vx = 1 + Math.random();
                } else {
                    particles[i].vx *= 1 + Math.random() * 0.005;
                }

                if (particles[i].y > window.innerHeight) {
                    particles[i].vy = -1 - Math.random();
                } else if (particles[i].y < 0) {
                    particles[i].vy = 1 + Math.random();
                } else {
                    particles[i].vy *= 1 + Math.random() * 0.005;
                }

                // 当前粒子的实际颜色（breathing 模式会随时间变化）
                let particleColor = particles[i].color;
                if (CONFIG.colorMode === 'breathing') {
                    const hue = (Date.now() / CONFIG.breathingSpeed + i * CONFIG.breathingSpread) % 360;
                    particleColor = 'hsl(' + hue + ', ' + CONFIG.saturation + '%, ' + CONFIG.lightness + '%)';
                }

                // 画拖尾
                context.strokeStyle = particleColor;
                context.beginPath();
                for (var j = 0; j < particles[i].history.length; j++) {
                    context.lineTo(particles[i].history[j].x, particles[i].history[j].y);
                }
                context.stroke();

                // 记录轨迹
                particles[i].history.push({
                    x: particles[i].x,
                    y: particles[i].y
                });
                if (particles[i].history.length > trailLength) {
                    particles[i].history.shift();
                }

                // 轨迹向指针方向偏移
                for (var j = 0; j < particles[i].history.length; j++) {
                    particles[i].history[j].x += 0.01 * (mouse.x - particles[i].history[j].x) / (trailLength / j);
                    particles[i].history[j].y += 0.01 * (mouse.y - particles[i].history[j].y) / (trailLength / j);
                }

                // 指针距离影响圆点大小
                let distanceFactor = DistanceBetween(mouse, particles[i]);
                distanceFactor = Math.pow(Math.max(Math.min(CONFIG.mouseInfluence - distanceFactor / 10, CONFIG.mouseInfluence), 2), 0.5);

                context.fillStyle = particleColor;
                context.beginPath();
                context.arc(particles[i].x, particles[i].y, particles[i].size * distanceFactor, 0, Math.PI * 2, true);
                context.closePath();
                context.fill();
            }

            requestAnimationFrame(TimeUpdate);
        }

        function MouseMove(e) {
            mouse.x = e.layerX;
            mouse.y = e.layerY;
        }

        // 移动端触摸：用 clientX/clientY 减去 canvas 位置，兼容性更好
        function TouchMove(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const t = e.touches[0];
            if (!t) return;
            mouse.x = t.clientX - rect.left;
            mouse.y = t.clientY - rect.top;
        }

        function Draw(x, y) {
            context.strokeStyle = '#ff0000';
            context.lineWidth = 4;
            context.lineTo(x, y);
            context.stroke();
        }

        function ResizeCanvas(e) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function DistanceBetween(p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            return Math.sqrt(dx * dx + dy * dy);
        }
    </script>
</body>
</html>
